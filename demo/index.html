<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>λ-Tune chạy trực tiếp</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --fg: #18202a; --muted: #5a6575; --line: #dce0e6;
  --accent: #2a55cc; --accent-soft: #e5ebfb; --ok: #1d8648; --ok-soft: #e1f2e7; --cut: #c43535; --cut-soft: #fae6e6;
  --skip: #8a93a1; --idx: #7646c0; --idx-soft: #eee7f9; --restart: #c07812; --restart-soft: #faefdb;
  --d1: #0b7686; --d2: #b2501a; --d3: #6a46c0; --on-color: #ffffff;
  --console-bg: #10151c; --console-fg: #d5dbe3; --console-muted: #7c8796;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #161b22; --surface-2: #1d242d; --fg: #e5e9ef; --muted: #98a3b2; --line: #2a323c;
    --accent: #7c9bf4; --accent-soft: #1d2843; --ok: #4dc07e; --ok-soft: #163020; --cut: #ef7070; --cut-soft: #3a1c1c;
    --skip: #7b8594; --idx: #b28bef; --idx-soft: #29203f; --restart: #e2a54a; --restart-soft: #392b14;
    --d1: #4fc1cf; --d2: #ef925a; --d3: #b28bef; --on-color: #0e1217;
    --console-bg: #0a0d11; --console-fg: #d5dbe3; --console-muted: #6f7a89;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #161b22; --surface-2: #1d242d; --fg: #e5e9ef; --muted: #98a3b2; --line: #2a323c;
  --accent: #7c9bf4; --accent-soft: #1d2843; --ok: #4dc07e; --ok-soft: #163020; --cut: #ef7070; --cut-soft: #3a1c1c;
  --skip: #7b8594; --idx: #b28bef; --idx-soft: #29203f; --restart: #e2a54a; --restart-soft: #392b14;
  --d1: #4fc1cf; --d2: #ef925a; --d3: #b28bef; --on-color: #0e1217;
  --console-bg: #0a0d11; --console-fg: #d5dbe3; --console-muted: #6f7a89;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
code, .mono, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: .92em; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-color); font-weight: 600; }
button.danger { background: var(--cut); border-color: var(--cut); color: var(--on-color); font-weight: 600; }
select, input[type=number] { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
input[type=number] { width: 80px; }

.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 9px 20px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-size: 18px; font-weight: 700; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
.health { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; font-size: 13px; }
.health span { padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.health .ok::before, .health .bad::before, .health .warn::before { content: "●"; margin-right: 5px; }
.health .ok::before { color: var(--ok); } .health .bad::before { color: var(--cut); } .health .warn::before { color: var(--restart); }
#clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; padding: 10px 20px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 5px 11px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 6px; border-radius: 5px; color: var(--on-color); vertical-align: 1px; }
.tag.D1 { background: var(--d1); } .tag.D2 { background: var(--d2); } .tag.D3 { background: var(--d3); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 16px; padding: 16px 20px 40px; align-items: start; }
#flow { min-width: 0; }
#console { position: sticky; top: 58px; height: calc(100vh - 74px); display: flex; flex-direction: column;
  background: var(--console-bg); color: var(--console-fg); border-radius: 10px; overflow: hidden; }
#console .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 12px; border-bottom: 1px solid #ffffff1a; font-size: 13px; }
#console .head b { font-size: 14px; }
#console .head label { color: var(--console-muted); }
#logpath { color: var(--console-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#log { flex: 1; overflow: auto; padding: 8px 0 16px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.ln { display: grid; grid-template-columns: 52px 1fr; padding: 0 10px; }
.ln .ts { color: var(--console-muted); }
.ln .tx { white-space: pre-wrap; word-break: break-word; }
.ln.hd { margin-top: 8px; } .ln.hd .tx { color: #8fb0ff; font-weight: 700; }
.ln.upd .tx { color: #ffffff; font-weight: 700; }
.ln.ev .tx { color: #c7b3f5; }
.ln.ok .tx { color: #9fd8b4; } .ln.cut .tx { color: #ff9a9a; } .ln.idx .tx { color: #c9a8ff; }
.ln.sys .tx, .ln.detail .tx { color: #a9b3c1; }
.ln.res .tx { color: #ffd479; font-weight: 700; } .ln.warn .tx { color: #f5c36b; } .ln.err .tx { color: #ff7b7b; font-weight: 700; }
#log.brief .ln.detail { display: none; }

.banner { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--fg); border-radius: 10px; padding: 9px 14px; margin-bottom: 14px; }
.banner.err { background: var(--cut-soft); border-color: var(--cut); }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.intro h2 { margin: 0 0 8px; font-size: 20px; }
.intro h2 small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.intro ol { padding-left: 22px; } .intro li { margin: 3px 0; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; scroll-margin-top: 66px; }
.stage > header { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 11px 16px; }
.stage .n { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: 13px; flex: none; }
.stage h2 { margin: 0; font-size: 17px; }
.stage .ref { color: var(--muted); font-size: 13px; }
.stage .st { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage.run { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stage.run .n { background: var(--accent); color: var(--on-color); }
.stage.done .n { background: var(--ok); color: var(--on-color); }
.stage.stopped .n, .stage.error .n { background: var(--cut); color: var(--on-color); }
.stage.wait, .stage.skipped { opacity: .55; }
.stage.wait .body, .stage.skipped .body { display: none; }
.stage .body { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.stage .body h3:first-child { margin-top: 0; }
h3 { font-size: 14px; margin: 16px 0 8px; }
h3 small { font-weight: 400; color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
.note { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
.warnbox { background: var(--restart-soft); border-left: 3px solid var(--restart); border-radius: 6px; padding: 6px 10px; margin: 6px 0; font-size: 13.5px; }
.errbox { background: var(--cut-soft); border-left: 3px solid var(--cut); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
.pill { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); } .pill.skip { color: var(--skip); }
.pill.saved { color: var(--muted); } .pill.live { color: var(--accent); border-color: var(--accent); }

.qgrid { display: flex; flex-wrap: wrap; gap: 7px; }
.qc { position: relative; display: inline-flex; flex-direction: column; align-items: center; min-width: 50px; padding: 3px 6px 2px;
  border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font: 12px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; }
.qc small { font-size: 10.5px; color: var(--muted); min-height: 13px; font-variant-numeric: tabular-nums; }
.qc.ok { background: var(--ok-soft); border-color: var(--ok); }
.qc.cut { background: var(--cut-soft); border-color: var(--cut); }
.qc.run { background: var(--accent-soft); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.qc.prev { opacity: .5; border-style: dotted; }
.qc.never { opacity: .45; border-style: dashed; }
.qc .ix { position: absolute; top: -8px; right: -7px; font-style: normal; font-size: 10px; line-height: 15px; padding: 0 4px; border-radius: 8px; background: var(--idx); color: var(--on-color); }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .qc.run, .bar.run { animation: none; } }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 4px 8px; }
td { border-bottom: 1px solid var(--line); padding: 4px 8px; vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.bars td.barcell { width: 40%; }
.bar { display: block; height: 10px; border-radius: 3px; background: var(--accent); min-width: 2px; }
.bar.d1 { background: var(--d1); } .bar.run { animation: pulse 1s infinite; background: var(--skip); }
.bar.slow { background: var(--d2); } .bar.cut { background: var(--cut); }
tr.dim td { color: var(--muted); }
tr.dim .bar { opacity: .35; }
tr.slow td { font-weight: 600; }
tr.best td { background: var(--ok-soft); }
td.top { font-size: 12px; color: var(--muted); }

pre.prompt { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; max-height: 460px; overflow: auto; margin: 6px 0; }
pre.prompt .jl { color: var(--accent); }
pre.prompt .d1 { background: color-mix(in srgb, var(--d1) 16%, transparent); color: var(--fg); }
pre.prompt .spec { font-weight: 700; }
pre.prompt .slowl { color: var(--d2); font-weight: 600; }
pre.prompt .cmd { color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 4px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile.good .v { color: var(--ok); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; background: var(--surface); }
.card .ch { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin: 4px 0; }
.card .stats b { color: var(--fg); }
.card.calling { border-style: dashed; border-color: var(--accent); }
details { margin-top: 4px; font-size: 13px; }
details summary { cursor: pointer; color: var(--accent); }
pre.cmds { white-space: pre-wrap; word-break: break-word; font-size: 11.5px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; max-height: 260px; overflow: auto; margin: 4px 0; }

.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.kind { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.k-unknown { color: var(--cut); } .k-invalid { color: var(--restart); } .k-clamp { color: var(--accent); }
.k-deny { color: var(--d2); } .k-dup { color: var(--skip); } .k-missing { color: var(--cut); } .k-redundant { color: var(--idx); }
ul.problems { margin: 4px 0; padding-left: 18px; font-size: 12.5px; }
ul.problems li { margin: 1px 0; }

.gantt { margin: 8px 0 2px; overflow: hidden; }
.gantt svg { display: block; }
.gantt .grid { stroke: var(--line); }
.gantt .tick { fill: var(--muted); font-size: 11px; }
.gantt .rowlabel { fill: var(--fg); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
.gantt .rowlabel.best { fill: var(--ok); font-weight: 700; }
.gantt .rowline { stroke: var(--line); stroke-dasharray: 2 3; }
.gantt .ev { fill: var(--surface-2); stroke: var(--line); }
.gantt .sg { stroke: var(--surface); stroke-width: .7; }
.sg.restart { fill: var(--restart); } .sg.index { fill: var(--idx); } .sg.ok { fill: var(--ok); } .sg.cut { fill: var(--cut); } .sg.run { fill: var(--accent); }
.gantt .star { fill: var(--ok); font-size: 15px; font-weight: 700; }
.skipmark line { stroke: var(--skip); stroke-width: 2; } .skipmark text { fill: var(--skip); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }

.cur { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 12px; }
.cur .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
.budget { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.budget span { display: block; height: 100%; background: var(--accent); }
.budget.over span { background: var(--cut); }
.lazy { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.lazy li { white-space: nowrap; }
.lazy li::before { content: "◆ "; color: var(--idx); }
.lazy li.made { color: var(--muted); }
.lazy li small { color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
ol.narr { list-style: none; padding: 0; margin: 0; max-height: 420px; overflow: auto; }
ol.narr li { padding: 6px 10px; border-left: 3px solid var(--line); margin-bottom: 5px; font-size: 14px; background: var(--surface-2); border-radius: 0 6px 6px 0; }
ol.narr li:first-child { box-shadow: 0 0 0 1px var(--accent) inset; }
ol.narr li.best { border-left-color: var(--ok); } ol.narr li.cut { border-left-color: var(--cut); }
ol.narr li.skip { border-left-color: var(--skip); } ol.narr li.info { border-left-color: var(--accent); }
ol.narr .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 6px; }
.meta { overflow-x: auto; }
.meta table { font-size: 13px; }
.meta th, .meta td { padding: 4px 5px; }
.meta td:first-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
.state { font-size: 12px; white-space: nowrap; }
.state.complete { color: var(--ok); font-weight: 600; } .state.cut { color: var(--cut); } .state.skip { color: var(--skip); } .state.run { color: var(--accent); font-weight: 600; }

@media (max-width: 1150px) {
  main { grid-template-columns: minmax(0, 1fr); }
  #console { position: static; height: 55vh; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .top, .controls, main { padding-left: 16px; padding-right: 16px; }
  .brand span { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">λ-Tune <span>chạy trực tiếp · TPC-H SF1 · PostgreSQL</span></div>
  <span id="clock"></span>
  <div class="health" id="health"><span>đang kiểm tra…</span></div>
  <button id="theme" title="Đổi giao diện sáng / tối">◐</button>
</header>

<section class="controls">
  <div class="group">
    <span class="lbl">Biến thể</span>
    <div class="seg" id="presets">
      <button data-p="000">λ-Tune</button>
      <button data-p="010">+ D2</button>
      <button data-p="101">+ D1 + D3</button>
      <button data-p="111">+ D1 + D2 + D3</button>
    </div>
    <label><input type="checkbox" id="d1"> <span class="tag D1">D1</span> prompt mở rộng</label>
    <label><input type="checkbox" id="d2"> <span class="tag D2">D2</span> vòng phản hồi</label>
    <label><input type="checkbox" id="d3"> <span class="tag D3">D3</span> kiểm định</label>
  </div>
  <div class="group">
    <span class="lbl">LLM</span>
    <label><input type="radio" name="llm" value="saved" checked> phản hồi đã lưu</label>
    <label id="liveLabel"><input type="radio" name="llm" value="live"> gọi thật <span id="model"></span></label>
    <span class="lbl">Ngân sách B</span>
    <label><input type="number" id="budget" min="1" step="1" placeholder="∞"> token</label>
  </div>
  <div class="group">
    <button id="run" class="primary">▶ Chạy</button>
    <button id="stop" class="danger" disabled>■ Dừng</button>
  </div>
  <div class="group">
    <span class="lbl">Lần chạy đã ghi</span>
    <select id="runs"><option value="">(chưa có)</option></select>
    <button id="load">Mở</button>
  </div>
</section>

<main>
  <div id="flow">
    <div id="banner"></div>
    <div id="stages"></div>
  </div>
  <aside id="console">
    <div class="head">
      <b>Log</b>
      <label><input type="checkbox" id="brief"> chỉ tóm tắt</label>
      <label><input type="checkbox" id="follow" checked> tự cuộn theo bước đang chạy</label>
      <span id="logpath"></span>
    </div>
    <div id="log"></div>
  </aside>
</main>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const minus = s => String(s).replace(/^-/, '−');
const num = (x, d = 2) => x == null || Number.isNaN(Number(x)) ? '—' : minus(Number(x).toFixed(d).replace('.', ','));
const sec = (x, d = 2) => x == null ? '—' : num(x, d) + ' s';
function compact(n) {
  if (n == null) return '';
  if (n >= 1e9) return num(n / 1e9, 1) + 'G';
  if (n >= 1e6) return num(n / 1e6, 1) + 'M';
  if (n >= 1e3) return num(n / 1e3, 1) + 'K';
  return String(Math.round(n));
}
function clock(t) {
  if (t == null || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

const logEl = $('#log');
const S = {
  job: null, stages: {}, list: [], live: false, finished: true, es: null, lastIndex: -1, lastTs: 0,
  dirty: new Set(), raf: 0, replaying: false, open: new Set(), status: null,
};

// ---------------------------------------------------------------- chọn biến thể
function options() {
  const llm = document.querySelector('input[name=llm]:checked').value;
  const b = $('#budget').value.trim();
  return { d1: $('#d1').checked, d2: $('#d2').checked, d3: $('#d3').checked, live_llm: llm === 'live', budget: b === '' ? null : Number(b) };
}
function syncPresets() {
  const o = options();
  const key = `${+o.d1}${+o.d2}${+o.d3}`;
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === key));
  if (!S.job) renderIntro();
}

function buildFlow(stages) {
  const root = $('#stages');
  root.innerHTML = '';
  S.stages = {}; S.list = [];
  stages.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'stage wait';
    el.id = 'st-' + s.id;
    el.innerHTML = `<header><span class="n">${i + 1}</span><h2>${esc(s.title)}</h2><span class="ref">${esc(s.ref)}</span>${tagHtml(s.tags)}<span class="st">chờ</span></header>

    root.appendChild(el);
    const st = { ...s, el, status: 'wait', t0: null, t1: null, data: initData(s.kind) };

function initData(kind) {
  if (kind === 'prompt') return { explains: {}, pairs: null, compress: null, filters: null, prompt: null, machine: null };
  if (kind === 'llm') return { responses: [], calling: null, saved: null, configs: null };
  if (kind === 'd3') return { configs: null };
  if (kind === 'select') return { sel: null, built: false };
  if (kind === 'feedback') return { fb: null, analyze: {}, apply: null, ix: [], final: null };

}

const RUN_LEVEL = new Set(['run_start', 'run_end', 'stage', 'error']);

    total: ev.total, official: ev.official, evals: [], skips: [], narr: [], cur: null, pending: null, final: null,
    phase: ev.incumbent ? 2 : 1, u: 0, meta,
    best: ev.incumbent ? { time: ev.incumbent.time, config: ev.incumbent.config } : { time: null, config: null },
  };

  const e = { config: ev.config, t: ev.t, start: ev.ts, end: null, before: ev.completed, timeBefore: ev.time_before, order: null, needs: {}, indexes: {}, groups: 0, segs: [], q: {}, made: {}, cutQ: null, used: 0, phase, runningQ: null, applying: null, errors: [] };

  const prevBest = s.best.time;

  m.updates += 1; m.done = ev.done;
  // best mới: lượt này chạy xong cả workload và tổng thời gian nhỏ hơn best (so số đo chính xác, không dùng số đã làm
  // tròn trong dòng log)
  const isNewBest = e != null && e.complete && (prevBest == null || e.time < prevBest);
  let text, cls = '';
  if (s.phase === 1) {
    s.u += 1;
    const round = Math.floor((s.u - 1) / k) + 1;
    if (ev.done === total) {
      text = `Vòng ${round}: ${c} chạy xong cả ${total} truy vấn, tổng ${sec(e && e.time)} → <b>best đầu tiên</b>. Dừng các vòng (dòng 6–13); mỗi cấu hình còn lại được thêm một lượt với timeout = best − thời gian nó đã dùng (dòng 14–15).`;
      cls = 'best'; s.phase = 2;
    } else {

      if (e && e.indexTime > ev.timeout) text += ` Tạo chỉ mục mất ${sec(e.indexTime)} > t, nên t được nâng lên bằng mức đó (dòng 12).`;

    }

      text = `${c} đã dùng ${sec(spent)} cho ${ev.done} truy vấn ở lượt trước; timeout = ${expr} ≤ 0, chắc chắn không nhanh hơn best → <b>bỏ qua</b>, không phải chạy.`;

      text = `${c}: timeout = ${expr}; xong ${total}/${total}, tổng ${sec(e.time)} &lt; ${sec(prevBest)} → <b>best mới</b>.`;
      cls = 'best';
    } else if (ev.done === total) {

    } else {
      text = `${c}: timeout = ${expr}; bị ngắt ở ${e.cutQ || '…'} sau ${ev.done}/${total} truy vấn → không thể nhanh hơn best ${sec(prevBest)}, loại.`;

    }

function promptHtml(text) {
  const lines = text.split('\n');
  let mode = '';
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() === '') { mode = ''; out.push(''); continue; }
    if (l.startsWith('Each row') && (lines[i + 1] || '').startsWith('{a column C}')) mode = 'd1';
    if (l.startsWith('Table sizes:')) mode = 'd1';
    let cls = mode;
    if (!cls && /^\w+\.\w+: /.test(l)) cls = 'jl';
    if (/^(memory|cores): /.test(l)) cls = 'spec';
    out.push(`<span class="${cls}">${esc(l)}</span>`);
  }
  return out.join('\n');
}

R.prompt = (st, c) => {

  if (d.pairs) {

    for (const p of d.pairs) {

      h += `<tr class="${d.compress && !on ? 'dim' : ''}"><td class="mono">${esc(p.a)} ⋈ ${esc(p.b)}</td><td class="barcell"><span class="bar" style="width:${(p.v / max * 100).toFixed(1)}%"></span></td><td class="num">${compact(p.v)}</td><td>${mark}</td></tr>`;

// Alg. 2-4
function niceStep(span) {
  for (const s of [1, 2, 5, 10, 15, 20, 30, 60, 120, 300, 600]) if (span / s <= 8) return s;
  return 1200;
}
function ganttSvg(s, width) {
  const W = Math.max(width || 0, 420);
  const L = 104, Rm = 26, T = 24, rowH = 30, B = 6;
  const H = T + s.names.length * rowH + B;
  const tNow = s.end != null ? s.end : Math.max(nowTs(), S.lastTs);
  const span = Math.max(tNow - s.start, 1);
  const step = niceStep(span);
  const xmax = Math.max(Math.ceil(span / step) * step, step);
  const X = t => L + Math.max(0, t - s.start) / xmax * (W - L - Rm);
  let g = '';
  for (let v = 0; v <= xmax + 1e-9; v += step) {
    const x = X(s.start + v).toFixed(1);
    g += `<line class="grid" x1="${x}" x2="${x}" y1="${T - 6}" y2="${H - B}"/><text class="tick" x="${x}" y="${T - 10}" text-anchor="middle">${v} s</text>`;
  }
  s.names.forEach((n, i) => {
    const y = T + i * rowH;
    const best = s.best.config === n;
    g += `<text class="rowlabel ${best ? 'best' : ''}" x="${L - 10}" y="${y + rowH / 2 + 4}" text-anchor="end">${best ? '★ ' : ''}${esc(n)}</text><line class="rowline" x1="${L}" x2="${W - Rm}" y1="${y + rowH}" y2="${y + rowH}"/>`;
  });
  for (const e of s.evals) {
    const i = s.names.indexOf(e.config);
    if (i < 0) continue;
    const y = T + i * rowH + 5, h = rowH - 10;
    const end = e.end != null ? e.end : tNow;
    g += `<rect class="ev" x="${X(e.start).toFixed(1)}" y="${y - 1}" width="${Math.max(X(end) - X(e.start), 1).toFixed(1)}" height="${h + 2}" rx="3"/>`;
    for (const sg of e.segs) {
      const b = sg.b != null ? sg.b : end;
      const cls = sg.kind === 'query' ? (sg.b == null ? 'run' : sg.ok ? 'ok' : 'cut') : sg.kind;
      const label = sg.kind === 'query' ? `${sg.q}: ${sec(b - sg.a)}${sg.ok === false ? ' (bị ngắt)' : ''}` : sg.kind === 'index' ? `${sg.sql}: ${sec(b - sg.a)}` : `khởi động lại PostgreSQL: ${sec(b - sg.a)}`;
      g += `<rect class="sg ${cls}" x="${X(sg.a).toFixed(1)}" y="${y}" width="${Math.max(X(b) - X(sg.a), 1).toFixed(1)}" height="${h}"><title>${esc(label)}</title></rect>`;
    }
    if (e.newBest) g += `<text class="star" x="${(X(end) + 3).toFixed(1)}" y="${y + h - 3}">★</text>`;
  }
  for (const k of s.skips) {
    const i = s.names.indexOf(k.config);
    if (i < 0) continue;
    const y = T + i * rowH + rowH / 2, x = X(k.ts).toFixed(1);
    g += `<g class="skipmark"><line x1="${x}" x2="${x}" y1="${y - 8}" y2="${y + 8}"/><text x="${(+x + 5).toFixed(1)}" y="${y + 4}">bỏ qua</text></g>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dòng thời gian các lượt đánh giá">${g}</svg>`;
}
const LEGEND = `<div class="legend"><span><i style="background:var(--restart)"></i>đổi tham số + khởi động lại</span><span><i style="background:var(--idx)"></i>tạo chỉ mục</span><span><i style="background:var(--ok)"></i>truy vấn xong</span><span><i style="background:var(--cut)"></i>truy vấn bị ngắt (hết timeout)</span><span>★ best mới</span></div>`;

function lazyPlan(e) {
  const made = new Set();
  const plan = [];
  for (const q of e.order || []) {
    for (const sql of e.needs[q] || []) {
      if (made.has(sql)) continue;
      made.add(sql);
      plan.push({ q, sql });
    }
  }
  return plan;
}
function curHtml(s) {
  const e = s.cur || s.evals[s.evals.length - 1];
  if (!e) return '<div class="empty">Chưa có lượt đánh giá nào.</div>';
  const running = e.end == null && s.cur === e;
  const rq = running && e.runningQ ? Math.max(0, nowTs() - e.runningQ.a) : 0;
  const used = Math.min(e.used + rq, Math.max(e.t, 0));
  const pct = e.t > 0 ? Math.min(100, used / e.t * 100) : 0;
  let h = `<div class="title"><span>${running ? 'Đang đánh giá' : 'Lượt vừa xong'}: <b class="mono">${esc(e.config)}</b></span><span>${esc(e.phase)}</span><span>timeout t = <b>${sec(e.t)}</b></span>`;
  if (running && e.applying != null) h += `<span style="color:var(--restart)">đang áp dụng ${e.applying} tham số và khởi động lại PostgreSQL…</span>`;
  h += `</div><div class="budget ${e.cutQ ? 'over' : ''}"><span style="width:${pct.toFixed(1)}%"></span></div><div class="legend"><span>${num(used)} / ${num(e.t)} s</span></div>`;
  const plan = lazyPlan(e);
  const before = {};
  for (const p of plan) (before[p.q] = before[p.q] || []).push(p.sql);
  h += '<h3>Thứ tự chạy (Alg. 4) <small>' + (e.order ? `${e.order.length} truy vấn · ${e.groups} nhóm` : 'đang tính…') + '</small></h3><div class="qgrid">';
  for (const q of e.before) h += `<span class="qc prev" title="đã xong ở lượt trước">${q}<small>✓</small></span>`;
  for (const q of e.order || []) {
    const info = e.q[q];
    const state = info ? info.state : (e.end != null ? 'never' : '');
    const n = (before[q] || []).length;
    const ix = n ? `<i class="ix" title="${esc((before[q] || []).map(x => (e.indexes[x] || {}).label).join(', '))}">+${n}</i>` : '';
    h += `<span class="qc ${state}">${q}${ix}<small>${info && info.sec != null ? num(info.sec) : ''}</small></span>`;
  }
  h += '</div>';
  if (e.order) {
    if (plan.length === 0) h += '<div class="legend" style="margin-top:6px">Cấu hình này không có chỉ mục nào có ích cho các truy vấn còn lại.</div>';
    else h += '<ul class="lazy">' + plan.map(p => { const ix = e.indexes[p.sql] || {}; const m = e.made[p.sql]; return `<li class="${m ? 'made' : ''}">${esc(ix.label)} <small>trước ${p.q} · ${compact(ix.cost)} dòng${m ? ' · tạo ' + sec(m.sec) : ''}</small></li>`; }).join('') + '</ul>';
  }
  if (e.errors && e.errors.length) h += `<div class="warnbox">PostgreSQL từ chối ${e.errors.length} lệnh: ${esc(e.errors.slice(0, 3).join(' · '))}${e.errors.length > 3 ? ' …' : ''}</div>`;
  return h;
}

    case 'config_apply': case 'config_applied': case 'drop_indexes': return 'detail sys';

  }
}

  const es = new EventSource(`/api/events?run=${encodeURIComponent(id)}&from=${from}`);
  S.es = es;
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.i <= S.lastIndex) return;
    S.lastIndex = ev.i;
    handle(ev);
  };
  es.addEventListener('end', () => { es.close(); S.es = null; });
}
async function start() {
  const body = options();
  const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { alert(j.error || 'Không chạy được'); return; }
  S.live = true; S.lastIndex = -1; S.finished = false;
  setRunning(true);
  connect(j.id, 0);
}
async function stop() {
  $('#stop').disabled = true;
  await fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
}
async function loadRun(id) {
  if (!id) return;
  if (S.status && S.status.running && S.status.current && S.status.current.id === id) {
    S.live = true; S.lastIndex = -1; setRunning(true); connect(id, 0); return;
  }
  if (S.es) { S.es.close(); S.es = null; }
  const r = await fetch('/api/runs/' + encodeURIComponent(id));
  if (!r.ok) { alert('Không mở được lần chạy này'); return; }
  const events = await r.json();
  S.live = false; S.lastIndex = -1; S.replaying = true;
  for (const ev of events) handle(ev);
  S.replaying = false;
  if (!S.finished) { S.finished = true; $('#banner').insertAdjacentHTML('beforeend', '<div class="banner err">Lần chạy này bị ngắt giữa chừng (server tắt khi đang chạy).</div>'); }
  for (const st of S.list) renderStage(st);
  $('#clock').textContent = '';
  logEl.scrollTop = logEl.scrollHeight;
}
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    S.status = s;
    const db = s.db.ok ? (s.db.leftover_indexes ? `<span class="warn">${esc(s.db.text)} · còn ${s.db.leftover_indexes} chỉ mục tuning</span>` : `<span class="ok">${esc(s.db.text)}</span>`) : `<span class="bad" title="${esc(s.db.text)}">PostgreSQL không kết nối được</span>`;
    const llm = s.llm.configured ? `<span class="ok">LLM ${esc(s.llm.model)}</span>` : '<span class="warn">chưa cấu hình LLM: chỉ dùng phản hồi đã lưu</span>';
    $('#health').innerHTML = db + llm;
    $('#model').textContent = s.llm.configured ? `(${s.llm.model})` : '';
    document.querySelector('input[name=llm][value=live]').disabled = !s.llm.configured || s.running;
    return s;
  } catch (e) {
    $('#health').innerHTML = '<span class="bad">mất kết nối tới demo/server.py</span>';
    return null;
  }
}
async function refreshRuns() {
  try {
    const runs = await (await fetch('/api/runs')).json();
    const label = { done: 'xong', stopped: 'đã dừng', error: 'lỗi', running: 'đang chạy', interrupted: 'bị ngắt' };
    $('#runs').innerHTML = runs.length ? runs.map(r => `<option value="${esc(r.id)}">${esc(r.started || r.id)} · ${esc(r.variant)}${r.live_llm ? ' · LLM thật' : ''} · ${label[r.status] || r.status}${r.best ? ` · ${esc(r.best)} ${sec(r.best_time)}` : ''}</option>`).join('') : '<option value="">(chưa có)</option>';
  } catch (e) { /* server tắt */ }
}
$('#run').addEventListener('click', start);
$('#stop').addEventListener('click', stop);
$('#load').addEventListener('click', () => loadRun($('#runs').value));

// giao diện sáng / tối
(function () {
  let saved = null;
  try { saved = localStorage.getItem('lt-demo-theme'); } catch (e) { /* trình duyệt chặn storage */ }
  if (saved) document.documentElement.dataset.theme = saved;
  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('lt-demo-theme', next); } catch (e) { /* bỏ qua */ }
  });
})();

setInterval(() => {
  if (!S.job || !S.live || S.finished) return;
  $('#clock').textContent = `đang chạy ${clock(nowTs())}`;
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = sec(nowTs() - Number(el.dataset.since), 0); });
  for (const st of S.list) {
    if (st.status !== 'run') continue;
    $('.st', st.el).textContent = statusLabel(st);
    if (st.kind === 'select') renderSelectLive(st);
  }
}, 250);
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { for (const st of S.list) if (st.kind === 'select' && st.data.sel) renderSelectLive(st); }, 150);
});

(async function init() {
  syncPresets();
  $('#presets button[data-p="111"]').click();
  const s = await refreshStatus();
  await refreshRuns();
  if (s && s.current) {
    if (s.running) { S.live = true; setRunning(true); connect(s.current.id, 0); }
    else await loadRun(s.current.id);
  }
})();
</script>
</body>
